<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Lucky5 Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-shell">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-sidebar-brand">
                <span class="admin-sidebar-logo">L5</span>
                <span class="admin-sidebar-title">Lucky5 Admin</span>
            </div>
            <nav class="admin-nav" aria-label="Admin navigation">
                <a class="admin-nav-link" data-admin-nav-link href="overview.html">Overview</a>
                <a class="admin-nav-link" data-admin-nav-link href="users.html">Users</a>
                <a class="admin-nav-link" data-admin-nav-link href="machines.html">Machines</a>
                <a class="admin-nav-link" data-admin-nav-link href="agents.html">Agents</a>
                <a class="admin-nav-link" data-admin-nav-link href="devices.html">Cabinet Devices</a>
                <a class="admin-nav-link" data-admin-nav-link href="content.html">Content</a>
            </nav>
        </aside>

        <div class="admin-main">
            <header class="admin-topbar">
                <div class="admin-topbar-title">Dashboard</div>
                <div class="admin-topbar-user">
                    <span>Signed in as <span class="admin-topbar-username" data-admin-username>admin</span></span>
                    <button type="button" class="admin-btn admin-btn-ghost" data-admin-logout>Log out</button>
                </div>
            </header>

            <main class="admin-content">
                <div class="admin-card">
                    <h2>Welcome, <span data-admin-username>admin</span></h2>
                    <p>
                        This is the Lucky5 admin dashboard shell. Use the sidebar to navigate to
                        Overview, Users, Machines, Agents, Cabinet Devices, and Content once those
                        sections are built out.
                    </p>
                </div>
            </main>
        </div>
    </div>

    <div id="admin-toast-region" class="admin-toast-region" aria-live="polite"></div>

    <script src="js/admin-api.js"></script>
    <script src="js/admin-shell.js"></script>
</body>
</html>
