                <span class="admin-sidebar-brand-text">

                </span>
            </div>

            <ul class="admin-nav">
                <li class="admin-nav-item">
                    <a class="admin-nav-link" href="overview.html">
                        <span class="admin-nav-icon">&#9632;</span>
                        Overview
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a class="admin-nav-link" href="users.html">
                        <span class="admin-nav-icon">&#9670;</span>
                        Users
                    </a>
                </li>
                <li class="admin-nav-item">
                    <a class="admin-nav-link" href="machines.html">
                        <span class="admin-nav-icon">&#9636;</span>

                    </a>
                </li>
                <li class="admin-nav-item">

                </li>

                <div class="admin-topbar-title">Welcome</div>

            <main class="admin-content">
                <script>window.location.replace('overview.html');</script>
                <noscript><p style="color:var(--admin-text-muted);">Redirecting to <a href="overview.html">Overview</a>…</p></noscript>
