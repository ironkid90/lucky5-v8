<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Lucky5 Admin — Sign In</title>
    <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-login-page">
    <main class="admin-login-card">
        <div class="admin-login-brand">
            <h1>Lucky5 Admin</h1>
            <p>Back-office dashboard</p>
        </div>

        <form id="admin-login-form" class="admin-form" novalidate>
            <div class="admin-form-group">
                <label for="admin-username">Username</label>
                <input type="text" id="admin-username" name="username" autocomplete="username" required autofocus />
            </div>
            <div class="admin-form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password" autocomplete="current-password" required />
            </div>

            <div id="admin-login-error" class="admin-form-error" role="alert" hidden></div>

            <button type="submit" class="admin-btn admin-btn-primary admin-btn-block" id="admin-login-submit">
                Sign In
            </button>
        </form>
    </main>

    <script src="js/admin-api.js"></script>
    <script>
        (function bootstrapLoginPage() {
            'use strict';

            if (window.AdminApi && window.AdminApi.isAuthenticated()) {
                window.location.replace('index.html');
                return;
            }

            const form = document.getElementById('admin-login-form');
            const errorBox = document.getElementById('admin-login-error');
            const submitBtn = document.getElementById('admin-login-submit');

            function showError(message) {
                errorBox.textContent = message;
                errorBox.hidden = false;
            }

            function hideError() {
                errorBox.hidden = true;
                errorBox.textContent = '';
            }

            form.addEventListener('submit', async function handleSubmit(event) {
                event.preventDefault();
                hideError();
                submitBtn.disabled = true;
                submitBtn.classList.add('is-loading');
                submitBtn.textContent = 'Signing in…';

                const username = document.getElementById('admin-username').value.trim();
                const password = document.getElementById('admin-password').value;

                try {
                    if (!username || !password) {
                        throw new Error('Username and password are required.');
                    }

                    const result = await window.AdminApi.login(username, password);
                    const profile = result?.profile || {};
                    const tokens = result?.tokens || {};
                    const role = String(profile.role || '').toLowerCase();

                    if (role !== 'admin') {
                        throw new Error('This account does not have admin access.');
                    }

                    if (!tokens.accessToken) {
                        throw new Error('Login succeeded but no access token was returned.');
                    }

                    window.AdminApi.setSession({
                        accessToken: tokens.accessToken,
                        refreshToken: tokens.refreshToken,
                        expiresAtUtc: tokens.expiresAtUtc,
                        profile
                    });

                    window.location.replace('index.html');
                } catch (error) {
                    showError(error?.message || 'Login failed. Please check your credentials and try again.');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('is-loading');
                    submitBtn.textContent = 'Sign In';
                }
            });
        })();
    </script>
</body>
</html>
